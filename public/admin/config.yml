# ── Sveltia CMS configuration ─────────────────────────────────────────────
# After you create the GitHub repo, replace OWNER/REPO below.
# base_url must be your production domain (the site itself hosts the OAuth
# endpoints at /api/auth and /api/callback).

backend:
  name: github
  repo: OWNER/REPO
  branch: main
  base_url: https://YOUR-DOMAIN.com
  auth_endpoint: api/auth

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: settings
    label: "Site Settings"
    files:
      - name: general
        label: "Business & SEO Settings"
        file: content/settings.json
        fields:
          - name: business
            label: Business
            widget: object
            fields:
              - { name: name, label: "Business name", widget: string }
              - { name: legalName, label: "Legal name", widget: string }
              - { name: tagline, label: Tagline, widget: string }
              - { name: phone, label: "Phone (display)", widget: string, hint: "e.g. (555) 123-4567" }
              - { name: phoneRaw, label: "Phone (dialable)", widget: string, hint: "e.g. +15551234567" }
              - { name: email, label: Email, widget: string }
              - name: address
                label: Address
                widget: object
                fields:
                  - { name: street, label: Street, widget: string }
                  - { name: city, label: City, widget: string }
                  - { name: state, label: State, widget: string }
                  - { name: zip, label: ZIP, widget: string }
              - { name: serviceArea, label: "Service area (cities)", widget: list }
              - name: hours
                label: Hours
                widget: list
                fields:
                  - { name: days, label: Days, widget: string }
                  - { name: hours, label: Hours, widget: string }
              - { name: yearsExperience, label: "Years of experience", widget: number, value_type: int }
              - { name: doorsInstalled, label: "Doors installed", widget: number, value_type: int }
              - { name: googleRating, label: "Google rating", widget: number, value_type: float, step: 0.1 }
              - { name: reviewCount, label: "Review count", widget: number, value_type: int }
              - { name: licensedInsured, label: "Licensed & insured", widget: boolean }
              - { name: emergency247, label: "24/7 emergency service", widget: boolean }
              - { name: warrantyYears, label: "Warranty (years)", widget: number, value_type: int }
          - name: seo
            label: SEO
            widget: object
            fields:
              - { name: siteUrl, label: "Site URL", widget: string }
              - { name: defaultTitle, label: "Default title", widget: string }
              - { name: defaultDescription, label: "Default description", widget: text }
              - { name: keywords, label: Keywords, widget: list }

  - name: services
    label: Services
    files:
      - name: services
        label: "Services list"
        file: content/services.json
        fields:
          - name: items
            label: Services
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: slug, label: "URL slug", widget: string, hint: "lowercase-with-dashes, becomes /services/<slug>" }
              - { name: title, label: Title, widget: string }
              - { name: shortTitle, label: "Short title", widget: string }
              - { name: excerpt, label: "Short description", widget: text }
              - { name: description, label: "Full description", widget: text, hint: "Separate paragraphs with a blank line" }
              - { name: features, label: "What's included", widget: list }
              - { name: image, label: Image, widget: image }
              - { name: featured, label: "Show on homepage", widget: boolean }

  - name: testimonials
    label: Reviews
    files:
      - name: testimonials
        label: "Customer reviews"
        file: content/testimonials.json
        fields:
          - name: items
            label: Reviews
            widget: list
            summary: "{{fields.name}} — {{fields.service}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: location, label: Location, widget: string }
              - { name: rating, label: "Rating (1–5)", widget: number, value_type: int, min: 1, max: 5 }
              - { name: text, label: Review, widget: text }
              - { name: service, label: Service, widget: string }

  - name: faq
    label: FAQ
    files:
      - name: faq
        label: "Frequently asked questions"
        file: content/faq.json
        fields:
          - name: items
            label: Questions
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { name: question, label: Question, widget: string }
              - { name: answer, label: Answer, widget: text }

  - name: gallery
    label: Gallery
    files:
      - name: gallery
        label: "Work gallery"
        file: content/gallery.json
        fields:
          - name: items
            label: Photos
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: category, label: Category, widget: string, hint: "e.g. Installation, Repair, Openers" }
              - { name: image, label: Photo, widget: image }
              - { name: description, label: Caption, widget: string }

  - name: about
    label: "About Page"
    files:
      - name: about
        label: "About content"
        file: content/about.json
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: story, label: "Our story", widget: text, hint: "Separate paragraphs with a blank line" }
          - name: values
            label: Values
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }
          - { name: certifications, label: Certifications, widget: list }
